$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Laptop",
      "price": 999.99,
      "stock": 10
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      if (pm.response.code === 201) {
          pm.collectionVariables.set("productId", pm.response.json()._id);
      }
    language: text/javascript
order: 1000
