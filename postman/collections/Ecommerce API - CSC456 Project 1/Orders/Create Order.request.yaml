$kind: http-request
description: "Many-to-one: the order stores the user id."
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "user": "{{userId}}",
      "products": [
        "{{productId}}"
      ],
      "totalPrice": 999.99
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      if (pm.response.code === 201) {
          pm.collectionVariables.set("orderId", pm.response.json()._id);
      }
    language: text/javascript
order: 1000
