$kind: http-request
description: "Many-to-many: adds the ids to both arrays."
url: "{{baseUrl}}/api/products/{{productId}}/categories/{{categoryId}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
